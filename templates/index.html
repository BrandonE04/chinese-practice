<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chinese Chatbot</h1>
        </div>
        <div class="translations">
            <h1>Translations</h1>
            <p>{{english}}</p>
        </div>
        <div class="chatBox">
            <div class="chats">
                {%for i in range(contextLength)%}
                    {%if i%2==0 %}
                        <p class="userMessage">{{context[i]}}</p>
                    {%else%}
                        <p class="botMessage">{{context[i]}}</p>
                    {%endif%}
                {%endfor%}
            </div>
            <div class="textMessage">
                <form action="./sendChat" method="POST">
                    <textarea name="userMessage" class="textInput"></textarea>
                    <button type="submit"></button>
                </form>
            </div>
        </div>
        <div class="mistakes">
            <h1>Mistakes</h1>
        </div>
    </div>
</body>
</html>
